name: Build Signed APK
on:
  push:
    branches: [ main ]
    # 文档类改动不触发构建
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          if [ ! -s "$GITHUB_WORKSPACE/release.keystore" ]; then
            echo "::error::Keystore decode produced an empty file. Check that the ANDROID_KEYSTORE_BASE64 secret is set."
            exit 1
          fi
          ls -l "$GITHUB_WORKSPACE/release.keystore"
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          REEDKIT_KEYSTORE: ${{ github.workspace }}/release.keystore
          REEDKIT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          REEDKIT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          REEDKIT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noctreed-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: NoctReed ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
